<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="900" cy="160" r="260" fill="url(#glow)"/>
  <circle cx="250" cy="480" r="260" fill="url(#glow)" opacity="0.6"/>

  <g font-family="Space Grotesk, Inter, sans-serif" text-anchor="middle">
    <text x="600" y="240" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">DEMO  IMAGE</text>
    <text x="600" y="330" font-size="96" font-weight="900" fill="url(#accent)" letter-spacing="-3">FastMotion</text>
    <text x="600" y="400" font-size="28" font-weight="500" fill="#94a3b8">Приклад картинки — поклади свої у public/</text>
    <text x="600" y="470" font-size="22" font-weight="600" fill="#39FF14" letter-spacing="2">1200 × 630  ·  SVG / WEBP / JPG</text>
  </g>

  <rect x="40" y="40" width="1120" height="550" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
